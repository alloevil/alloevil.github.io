<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="cbTitle cbDesc">
  <title id="cbTitle">Cyber's Blog — a technical blog by allo</title>
  <desc id="cbDesc">A Jekyll blog on AI agents, LLM engineering and agentic coding, with a training log and a project index. Four sections (home, workout, projects, blog), four posts, and machine-readable endpoints for LLM crawlers.</desc>

  <rect width="1200" height="320" rx="18" fill="#e8d5b7"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" fill="none" stroke="#0e2431" stroke-opacity="0.18"/>

